<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عقارات — سوق الحراج اليمني</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <div class="container">
    <div class="page-head">
      <h2>🏠 قسم العقارات</h2>
      <p>بيع وإيجار شقق، فلل، أراضي، محلات ومكاتب</p>
    </div>

    <button class="btn btn-amber" id="toggle-form">+ أضف إعلان عقاري</button>

    <form id="add-form" class="card" style="display:none;margin-top:12px">
      <div class="field">
        <label>عنوان الإعلان</label>
        <input type="text" id="f-title" placeholder="مثال: شقة 3 غرف للإيجار - حدة" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>نوع العقار</label>
          <select id="f-type">
            <option>شقة</option><option>فيلا</option><option>أرض</option><option>محل تجاري</option><option>مكتب</option><option>استراحة</option>
          </select>
        </div>
        <div class="field">
          <label>نوع العملية</label>
          <select id="f-deal">
            <option value="sale">بيع</option>
            <option value="rent">إيجار</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>السعر</label>
          <input type="number" id="f-price" required>
        </div>
        <div class="field">
          <label>العملة</label>
          <select id="f-currency"><option>YER</option><option>SAR</option><option>USD</option></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>المدينة</label>
          <input type="text" id="f-city" placeholder="صنعاء" required>
        </div>
        <div class="field">
          <label>الحي</label>
          <input type="text" id="f-district">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>المساحة (م²)</label>
          <input type="number" id="f-area">
        </div>
        <div class="field">
          <label>عدد الغرف</label>
          <input type="number" id="f-rooms">
        </div>
      </div>
      <div class="field">
        <label>تفاصيل إضافية</label>
        <textarea id="f-desc" placeholder="وصف العقار، الطابق، المرافق..."></textarea>
      </div>
      <div class="field">
        <label>صورة العقار (إلزامية)</label>
        <input type="file" id="f-image" accept="image/*" required>
        <small>الصورة إلزامية حتى تساعد المهتمين على الثقة بالإعلان</small>
      </div>
      <button class="btn btn-primary" type="submit" id="submit-btn">نشر الإعلان</button>
    </form>

    <div class="tabs" id="tabs">
      <button data-f="all" class="active">الكل</button>
      <button data-f="sale">للبيع</button>
      <button data-f="rent">للإيجار</button>
    </div>

    <div id="listings"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/data.js"></script>
<script src="/js/app.js"></script>
<script>
  initChrome("real-estate");

  const toggleBtn = document.getElementById("toggle-form");
  const form = document.getElementById("add-form");
  toggleBtn.onclick = () => {
    DB.currentUser().then((u) => {
      if (!u) { window.location.href = "/pages/auth.html?next=" + encodeURIComponent(window.location.pathname); return; }
      form.style.display = form.style.display === "none" ? "" : "none";
    });
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById("f-image");
    const file = fileInput.files[0];
    if (!file) { toast("الرجاء اختيار صورة للعقار", "error"); return; }
    const submitBtn = document.getElementById("submit-btn");
    submitBtn.disabled = true;
    submitBtn.textContent = "جارِ رفع الصورة...";
    try {
      const coverImageUrl = await DB.uploadImage(file, "real-estate");
      await DB.realEstate.add({
        title: document.getElementById("f-title").value.trim(),
        propertyType: document.getElementById("f-type").value,
        dealType: document.getElementById("f-deal").value,
        price: document.getElementById("f-price").value,
        currency: document.getElementById("f-currency").value,
        city: document.getElementById("f-city").value.trim(),
        district: document.getElementById("f-district").value.trim(),
        areaSqm: document.getElementById("f-area").value,
        rooms: document.getElementById("f-rooms").value,
        description: document.getElementById("f-desc").value.trim(),
        coverImageUrl,
      });
      toast("تم نشر إعلانك");
      form.reset(); form.style.display = "none";
      loadList();
    } catch (err) {
      toast(err.message, "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "نشر الإعلان";
    }
  });

  let activeFilter = "all";
  const params = new URLSearchParams(window.location.search);
  const onlyMine = params.get("mine") === "1";

  document.getElementById("tabs").addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    [...document.querySelectorAll("#tabs button")].forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    activeFilter = e.target.dataset.f;
    loadList();
  });

  let favSet = new Set();

  function loadList() {
    Promise.all([DB.currentUser(), DB.favorites.list()]).then(([me, favs]) => {
      favSet = new Set(favs.filter(f => f.targetType === "real_estate").map(f => f.targetId));
      DB.realEstate.list().then((items) => {
        let filtered = items.filter(i => activeFilter === "all" || i.dealType === activeFilter);
        if (onlyMine && me) filtered = filtered.filter(i => i.ownerId === me.id);
        renderList(filtered, me);
      });
    });
  }

  function renderList(items, me) {
    const box = document.getElementById("listings");
    if (!items.length) {
      box.innerHTML = `<div class="empty-state"><span class="ic">🏠</span>ما فيه إعلانات عقارية حتى الآن. كن أول من ينشر!</div>`;
      return;
    }
    box.innerHTML = items.map(i => `
      <div class="card listing-card">
        ${i.coverImageUrl ? `<img src="${esc(i.coverImageUrl)}" alt="${esc(i.title)}" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;margin-bottom:8px" loading="lazy">` : ""}
        <div class="top-row">
          <h4>${esc(i.title)}</h4>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="fav-btn" data-fav="${i.id}" aria-label="حفظ في المفضلة" style="background:none;border:none;font-size:1.1rem;cursor:pointer;padding:2px">${favSet.has(i.id) ? "❤️" : "🤍"}</button>
            <span class="price-tag">${fmtPrice(i.price, i.currency)}</span>
          </div>
        </div>
        <div class="meta-row">
          <span class="badge">${i.dealType === "sale" ? "للبيع" : "للإيجار"}</span>
          <span>${esc(i.propertyType)}</span>
          <span>📍 ${esc(i.city)}${i.district ? " - " + esc(i.district) : ""}</span>
          ${i.areaSqm ? `<span>${esc(i.areaSqm)} م²</span>` : ""}
          ${i.rooms ? `<span>${esc(i.rooms)} غرف</span>` : ""}
        </div>
        ${i.description ? `<p style="margin:4px 0 0;font-size:.85rem;color:var(--ink-light)">${esc(i.description)}</p>` : ""}
        <div class="meta-row" style="justify-content:space-between;margin-top:6px">
          <span style="font-size:.72rem">نشره ${esc(i.ownerName)}${i.ownerOnline ? ' <span class="dot on" title="متصل الآن"></span>' : ''} · ${timeAgo(i.createdAt)}</span>
          ${me && me.id === i.ownerId
            ? `<button class="btn btn-sm btn-outline" data-view-offers="${i.id}">📋 عرض المزايدات</button>`
            : `<div style="display:flex;gap:6px">
                 <button class="btn btn-sm btn-outline" data-bid-toggle="${i.id}">💰 سوم</button>
                 <button class="btn btn-sm btn-primary" onclick="goChat('${i.ownerId}','real_estate','${i.id}','${esc(i.ownerName)}')">تواصل</button>
               </div>`}
        </div>
        <div data-bid-form="${i.id}" style="display:none;margin-top:8px;gap:8px;align-items:stretch" class="flex-row">
          <input type="number" placeholder="قيمة عرضك" data-bid-amount="${i.id}" style="flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:8px">
          <button class="btn btn-sm btn-amber" data-bid-submit="${i.id}" style="flex:none">إرسال العرض</button>
        </div>
        <div class="offers-box" data-offers-box="${i.id}" style="display:none;margin-top:8px"></div>
      </div>
    `).join("");

    wireBidding(items, me);
    wireFavorites();
  }

  function wireFavorites() {
    document.querySelectorAll("[data-fav]").forEach((btn) => {
      btn.onclick = async () => {
        const id = btn.dataset.fav;
        try {
          const nowFav = await DB.favorites.toggle("real_estate", id);
          btn.textContent = nowFav ? "❤️" : "🤍";
          if (nowFav) favSet.add(id); else favSet.delete(id);
        } catch (err) { toast(err.message, "error"); }
      };
    });
  }

  const OFFER_STATUS_LABELS = { pending: "بانتظار الرد", accepted: "✅ مقبول", rejected: "✖️ مرفوض" };

  function wireBidding(items, me) {
    const byId = {};
    items.forEach((i) => (byId[i.id] = i));

    document.querySelectorAll("[data-bid-toggle]").forEach((btn) => {
      btn.onclick = () => {
        const id = btn.dataset.bidToggle;
        const form = document.querySelector(`[data-bid-form="${id}"]`);
        form.style.display = form.style.display === "flex" ? "none" : "flex";
      };
    });

    document.querySelectorAll("[data-bid-submit]").forEach((btn) => {
      btn.onclick = async () => {
        const id = btn.dataset.bidSubmit;
        const input = document.querySelector(`[data-bid-amount="${id}"]`);
        const amount = Number(input.value);
        if (!amount || amount <= 0) { toast("أدخل قيمة عرض صحيحة", "error"); return; }
        const listing = byId[id];
        try {
          await DB.requireAuth();
          await DB.offers.add({ listingId: id, amount, currency: listing.currency });
          await DB.messages.add({
            receiverId: listing.ownerId, contextType: "real_estate", contextId: id,
            body: `💰 عرض جديد بقيمة ${fmtPrice(amount, listing.currency)} على إعلانك "${listing.title}"`,
          });
          toast("تم إرسال عرضك وإشعار صاحب الإعلان");
          input.value = "";
        } catch (err) { toast(err.message, "error"); }
      };
    });

    document.querySelectorAll("[data-view-offers]").forEach((btn) => {
      btn.onclick = async () => {
        const id = btn.dataset.viewOffers;
        const box = document.querySelector(`[data-offers-box="${id}"]`);
        if (box.style.display === "block") { box.style.display = "none"; return; }
        box.style.display = "block";
        box.innerHTML = `<p style="font-size:.78rem;color:var(--ink-light)">جارِ التحميل...</p>`;
        try {
          const offers = await DB.offers.listForListing(id);
          if (!offers.length) { box.innerHTML = `<p style="font-size:.78rem;color:var(--ink-light)">لا توجد عروض بعد</p>`; return; }
          box.innerHTML = offers.map((o) => `
            <div class="meta-row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--border)">
              <span style="font-size:.8rem">${esc(o.bidderName)}: <strong>${fmtPrice(o.amount, o.currency)}</strong> <span style="color:var(--ink-light)">(${OFFER_STATUS_LABELS[o.status]})</span></span>
              ${o.status === "pending" ? `<button class="btn btn-sm btn-primary" data-accept-offer="${o.id}" data-offer-amount="${o.amount}" data-offer-currency="${o.currency}" data-offer-bidder="${o.bidderId}" data-offer-listing="${id}">قبول</button>` : ""}
            </div>
          `).join("");
          box.querySelectorAll("[data-accept-offer]").forEach((abtn) => {
            abtn.onclick = async () => {
              try {
                await DB.offers.setStatus(abtn.dataset.acceptOffer, "accepted");
                await DB.messages.add({
                  receiverId: abtn.dataset.offerBidder, contextType: "real_estate", contextId: abtn.dataset.offerListing,
                  body: `🎉 تم قبول عرضك بقيمة ${fmtPrice(abtn.dataset.offerAmount, abtn.dataset.offerCurrency)}! تواصل مع المعلن لإتمام الصفقة`,
                });
                toast("تم القبول وإشعار صاحب العرض");
                box.style.display = "none";
                btn.click();
              } catch (err) { toast(err.message, "error"); }
            };
          });
        } catch (err) {
          box.innerHTML = `<p style="font-size:.78rem;color:var(--danger)">${esc(err.message)}</p>`;
        }
      };
    });
  }

  loadList();
  renderFooter();
</script>
</body>
</html>
