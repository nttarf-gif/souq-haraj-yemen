<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="pg-title">مقال — سوق الحراج اليمني</title>
<meta name="description" id="pg-desc" content="مقالات ونصائح من سوق الحراج اليمني.">
<link rel="canonical" id="pg-canonical" href="https://souqalharaj1.com/pages/blog-post.html">
<meta name="robots" content="index, follow">
<meta property="og:type" content="article">
<meta property="og:site_name" content="سوق الحراج اليمني">
<meta property="og:locale" content="ar_YE">
<meta property="og:title" id="pg-og-title" content="مقال — سوق الحراج اليمني">
<meta property="og:description" id="pg-og-desc" content="مقالات ونصائح من سوق الحراج اليمني.">
<meta property="og:url" id="pg-og-url" content="https://souqalharaj1.com/pages/blog-post.html">
<link rel="stylesheet" href="/css/style.css">
<style>
  .article-body { font-size: .95rem; line-height: 2; color: var(--ink); }
  .article-body h2 { font-size: 1.15rem; margin: 20px 0 8px; }
  .article-body h3 { font-size: 1.02rem; margin: 16px 0 6px; }
  .article-body p { margin: 0 0 12px; }
  .article-body ul, .article-body ol { margin: 0 0 12px; padding-inline-start: 20px; }
  .article-body li { margin-bottom: 6px; }
  .article-body a { color: var(--primary, #0f6b63); }
</style>
</head>
<body>
<main>
  <div class="container">
    <div id="post-wrap">
      <div class="empty-state"><span class="ic">⏳</span>جارِ تحميل المقال...</div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin:0 0 8px">هل أعجبك المقال؟</h3>
      <p style="font-size:.85rem;color:var(--ink-light);margin:0 0 10px">تصفح أقسام سوق الحراج اليمني مباشرة:</p>
      <div class="sections-grid" id="sections-grid"></div>
    </div>
    <div style="margin-top:14px">
      <a href="/pages/blog.html" class="btn btn-outline">← كل المقالات</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/data.js"></script>
<script src="/js/app.js"></script>
<script src="/js/visit-tracker.js"></script>
<script>
  initChrome("blog");

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" }); }
    catch (e) { return ""; }
  }

  function renderSectionsGrid() {
    document.getElementById("sections-grid").innerHTML = SECTIONS.map((s) => `
      <a href="${s.href}" class="section-card">
        <span class="ic">${s.icon}</span>
        <h4>${esc(s.title)}</h4>
        <p>${esc(s.desc)}</p>
      </a>
    `).join("");
  }

  async function load() {
    const slug = new URLSearchParams(window.location.search).get("slug");
    const wrap = document.getElementById("post-wrap");
    if (!slug) {
      wrap.innerHTML = `<div class="empty-state"><span class="ic">❓</span>لم يتم تحديد مقال.</div>`;
      return;
    }
    let post;
    try {
      post = await DB.blog.getBySlug(slug);
    } catch (e) {
      post = null;
    }
    if (!post) {
      wrap.innerHTML = `<div class="empty-state"><span class="ic">🚫</span>هذا المقال غير موجود أو تم حذفه. <br><a href="/pages/blog.html">تصفح بقية المقالات</a></div>`;
      return;
    }

    const metaTitle = post.meta_title || (post.title + " — سوق الحراج اليمني");
    const metaDesc = post.meta_description || post.excerpt || "";
    const url = "https://souqalharaj1.com/pages/blog-post.html?slug=" + encodeURIComponent(post.slug);

    document.title = metaTitle;
    document.getElementById("pg-title").textContent = metaTitle;
    document.getElementById("pg-desc").setAttribute("content", metaDesc);
    document.getElementById("pg-canonical").setAttribute("href", url);
    document.getElementById("pg-og-title").setAttribute("content", metaTitle);
    document.getElementById("pg-og-desc").setAttribute("content", metaDesc);
    document.getElementById("pg-og-url").setAttribute("content", url);
    if (post.keywords) {
      const m = document.createElement("meta");
      m.name = "keywords";
      m.content = post.keywords;
      document.head.appendChild(m);
    }

    const ld = document.createElement("script");
    ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": post.title,
      "description": metaDesc,
      "inLanguage": "ar",
      "datePublished": post.published_at,
      "dateModified": post.updated_at || post.published_at,
      "author": { "@type": "Organization", "name": "سوق الحراج اليمني" },
      "publisher": { "@type": "Organization", "name": "سوق الحراج اليمني", "url": "https://souqalharaj1.com/" },
      "mainEntityOfPage": { "@type": "WebPage", "@id": url }
    });
    document.head.appendChild(ld);

    wrap.innerHTML = `
      <article>
        <div class="page-head">
          <h2>${esc(post.cover_emoji || "📝")} ${esc(post.title)}</h2>
          <div class="meta-row">
            ${post.category ? `<span class="badge">${esc(post.category)}</span>` : ""}
            <span style="font-size:.78rem">${fmtDate(post.published_at)}</span>
          </div>
        </div>
        <div class="article-body">${post.content_html}</div>
      </article>
    `;
  }

  renderSectionsGrid();
  load();
  renderFooter();
</script>
</body>
</html>
