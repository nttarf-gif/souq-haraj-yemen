<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خدمات حرة: مقاولين، دهان، صيانة — سوق الحراج اليمني</title>
<meta name="description" content="دور على أي خدمة تحتاجها في اليمن: مقاولين، دهان، كهربائي، صيانة، ومواهب حرة — أو انشر خدمتك وصنّفها بنفسك.">
<link rel="canonical" href="https://souq-haraj-yemen-app.netlify.app/pages/services.html">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="سوق الحراج اليمني">
<meta property="og:locale" content="ar_YE">
<meta property="og:title" content="خدمات حرة في اليمن">
<meta property="og:description" content="مقاولين، دهان، صيانة، مواهب حرة — أي خدمة لم تجد لها قسمًا، أضفها بنفسك.">
<meta property="og:url" content="https://souq-haraj-yemen-app.netlify.app/pages/services.html">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <div class="container">
    <div class="page-head">
      <h2>🛠️ خدمات حرة</h2>
      <p>مقاولين، دهان، صيانة، مواهب... أي خدمة لم تجد لها قسمًا، أضف تصنيفها وانشرها</p>
    </div>

    <div class="flex-row" style="gap:8px;margin-bottom:10px">
      <button class="btn btn-outline" id="toggle-cat-form">+ أضف تصنيف جديد</button>
      <button class="btn btn-amber" id="toggle-form">+ أضف خدمتي</button>
    </div>

    <form id="add-cat-form" class="card" style="display:none;margin-bottom:12px">
      <div class="field-row">
        <div class="field" style="flex:2">
          <label>اسم التصنيف</label>
          <input type="text" id="c-name" placeholder="مثال: مقاولين، دهان، كهربائي..." required>
        </div>
        <div class="field" style="flex:1">
          <label>رمز (اختياري)</label>
          <input type="text" id="c-icon" placeholder="🛠️" maxlength="4">
        </div>
      </div>
      <button class="btn btn-primary" type="submit">إضافة التصنيف</button>
    </form>

    <form id="add-form" class="card" style="display:none;margin-bottom:12px">
      <div class="field">
        <label>التصنيف</label>
        <select id="f-category" required></select>
      </div>
      <div class="field">
        <label>عنوان الخدمة</label>
        <input type="text" id="f-title" placeholder="مثال: مقاول تشطيبات وصيانة عامة" required>
      </div>
      <div class="field">
        <label>وصف الخدمة</label>
        <textarea id="f-desc" placeholder="اشرح خدمتك، خبرتك، ما تقدمه..."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>المدينة</label>
          <input type="text" id="f-city" placeholder="صنعاء">
        </div>
        <div class="field">
          <label>السعر / ملاحظة السعر</label>
          <input type="text" id="f-price" placeholder="يبدأ من... / حسب الحالة">
        </div>
      </div>
      <button class="btn btn-primary" type="submit" id="submit-btn">نشر الخدمة</button>
    </form>

    <div class="tabs" id="cat-tabs" style="flex-wrap:wrap">
      <button data-c="all" class="active">الكل</button>
    </div>

    <button class="btn btn-outline" id="toggle-filters" style="margin:8px 0">🔍 فلاتر البحث</button>
    <div id="filters-box" class="card" style="display:none;margin-bottom:10px">
      <div class="field-row">
        <div class="field">
          <label>المدينة</label>
          <input type="text" id="flt-city" placeholder="صنعاء">
        </div>
        <div class="field">
          <label>كلمة في العنوان</label>
          <input type="text" id="flt-q" placeholder="مثال: دهان">
        </div>
      </div>
      <div class="flex-row" style="gap:8px">
        <button class="btn btn-primary" id="apply-filters" style="flex:1">تطبيق الفلتر</button>
        <button class="btn btn-outline" id="clear-filters" style="flex:1">مسح</button>
      </div>
    </div>

    <div id="services-list"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/data.js"></script>
<script src="/js/app.js"></script>
<script src="/js/visit-tracker.js"></script>
<script>
  initChrome("services");

  let categories = [];
  let activeCat = "all";
  let searchFilters = { city: "", q: "" };

  document.getElementById("toggle-filters").onclick = () => {
    const box = document.getElementById("filters-box");
    box.style.display = box.style.display === "none" ? "" : "none";
  };
  document.getElementById("apply-filters").onclick = () => {
    searchFilters = {
      city: document.getElementById("flt-city").value.trim(),
      q: document.getElementById("flt-q").value.trim(),
    };
    loadList();
  };
  document.getElementById("clear-filters").onclick = () => {
    document.getElementById("flt-city").value = "";
    document.getElementById("flt-q").value = "";
    searchFilters = { city: "", q: "" };
    loadList();
  };

  const catForm = document.getElementById("add-cat-form");
  document.getElementById("toggle-cat-form").onclick = () => {
    DB.currentUser().then((u) => {
      if (!u) { window.location.href = "/pages/auth.html?next=" + encodeURIComponent(window.location.pathname); return; }
      catForm.style.display = catForm.style.display === "none" ? "" : "none";
    });
  };

  catForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await DB.serviceCategories.add({
        name: document.getElementById("c-name").value.trim(),
        icon: document.getElementById("c-icon").value.trim(),
      });
      toast("تم إضافة التصنيف");
      catForm.reset(); catForm.style.display = "none";
      await loadCategories();
    } catch (err) { toast(err.message, "error"); }
  });

  const form = document.getElementById("add-form");
  document.getElementById("toggle-form").onclick = () => {
    DB.currentUser().then((u) => {
      if (!u) { window.location.href = "/pages/auth.html?next=" + encodeURIComponent(window.location.pathname); return; }
      if (!categories.length) { toast("أضف تصنيفًا أولاً", "error"); return; }
      form.style.display = form.style.display === "none" ? "" : "none";
    });
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById("submit-btn");
    submitBtn.disabled = true;
    try {
      await DB.serviceListings.add({
        categoryId: document.getElementById("f-category").value,
        title: document.getElementById("f-title").value.trim(),
        description: document.getElementById("f-desc").value.trim(),
        city: document.getElementById("f-city").value.trim(),
        priceNote: document.getElementById("f-price").value.trim(),
      });
      toast("تم نشر خدمتك");
      form.reset(); form.style.display = "none";
      loadList();
    } catch (err) {
      toast(err.message, "error");
    } finally {
      submitBtn.disabled = false;
    }
  });

  async function loadCategories() {
    categories = await DB.serviceCategories.list();
    const sel = document.getElementById("f-category");
    sel.innerHTML = categories.map((c) => `<option value="${c.id}">${esc(c.icon)} ${esc(c.name)}</option>`).join("");
    const tabs = document.getElementById("cat-tabs");
    tabs.innerHTML = `<button data-c="all" class="${activeCat === "all" ? "active" : ""}">الكل</button>` +
      categories.map((c) => `<button data-c="${c.id}" class="${activeCat === c.id ? "active" : ""}">${esc(c.icon)} ${esc(c.name)}</button>`).join("");
    tabs.querySelectorAll("button").forEach((b) => {
      b.onclick = () => {
        tabs.querySelectorAll("button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        activeCat = b.dataset.c;
        loadList();
      };
    });
    loadList();
  }

  function catLabel(id) {
    const c = categories.find((x) => x.id === id);
    return c ? `${c.icon} ${c.name}` : "";
  }

  let favSet = new Set();

  async function loadList() {
    const [me, favs] = await Promise.all([DB.currentUser(), DB.favorites.list()]);
    favSet = new Set(favs.filter((f) => f.targetType === "service").map((f) => f.targetId));
    const items = await DB.serviceListings.list((i) => i.status === "active");
    let filtered = activeCat === "all" ? items : items.filter((i) => i.categoryId === activeCat);
    if (searchFilters.city) filtered = filtered.filter((i) => i.city.includes(searchFilters.city));
    if (searchFilters.q) filtered = filtered.filter((i) => i.title.includes(searchFilters.q) || i.description.includes(searchFilters.q));
    const box = document.getElementById("services-list");
    if (!filtered.length) {
      box.innerHTML = `<div class="empty-state"><span class="ic">🛠️</span>ما فيه خدمات في هذا التصنيف حتى الآن. كن أول من ينشر!</div>`;
      return;
    }
    box.innerHTML = rankByBump(filtered).map((i) => `
      <div class="card listing-card">
        <div class="top-row">
          <h4>${esc(i.title)}</h4>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="fav-btn" data-fav="${i.id}" aria-label="حفظ في المفضلة" style="background:none;border:none;font-size:1.1rem;cursor:pointer;padding:2px">${favSet.has(i.id) ? "❤️" : "🤍"}</button>
            ${i.priceNote ? `<span class="price-tag">${esc(i.priceNote)}</span>` : ""}
          </div>
        </div>
        <div class="meta-row">
          <span class="badge">${esc(catLabel(i.categoryId))}</span>
          ${i.city ? `<span>📍 ${esc(i.city)}</span>` : ""}
        </div>
        ${i.description ? `<p style="margin:4px 0 0;font-size:.85rem;color:var(--ink-light)">${esc(i.description)}</p>` : ""}
        <div class="meta-row" style="justify-content:space-between;margin-top:6px">
          <span style="font-size:.72rem">نشره ${esc(i.providerName)}${i.providerOnline ? ' <span class="dot on" title="متصل الآن"></span>' : ''} · ${timeAgo(i.createdAt)}</span>
          ${me && me.id === i.providerId
            ? (bumpCooldownRemaining(i) === 0
                ? `<button class="btn btn-sm btn-amber" data-bump="${i.id}">⬆️ تحديث الإعلان</button>`
                : `<span style="font-size:.68rem;color:var(--ink-light)">يمكن التحديث بعد ${Math.ceil(bumpCooldownRemaining(i) / 3600000)} س</span>`)
            : `<button class="btn btn-sm btn-primary" onclick="goChat('${i.providerId}','service','${i.id}','${esc(i.providerName)}')">تواصل</button>`}
        </div>
      </div>
    `).join("");
    wireFavorites();
  }

  function wireFavorites() {
    document.querySelectorAll("[data-fav]").forEach((btn) => {
      btn.onclick = async () => {
        const id = btn.dataset.fav;
        try {
          const nowFav = await DB.favorites.toggle("service", id);
          btn.textContent = nowFav ? "❤️" : "🤍";
          if (nowFav) favSet.add(id); else favSet.delete(id);
        } catch (err) { toast(err.message, "error"); }
      };
    });
    document.querySelectorAll("[data-bump]").forEach((btn) => {
      btn.onclick = async () => {
        const id = btn.dataset.bump;
        btn.disabled = true;
        try {
          await DB.serviceListings.bump(id);
          toast("تم تحديث خدمتك وأصبحت بالأعلى");
          loadList();
        } catch (err) { toast(err.message, "error"); btn.disabled = false; }
      };
    });
  }

  loadCategories();
  renderFooter();
</script>
</body>
</html>
