<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابي — سوق الحراج اليمني</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <div class="container">
    <div class="page-head"><h2>حسابي</h2></div>
    <div id="account-box"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/data.js"></script>
<script src="/js/app.js"></script>
<script>
  initChrome("");
  const box = document.getElementById("account-box");

  DB.currentUser().then((u) => {
    if (!u) {
      window.location.href = "/pages/auth.html";
      return;
    }
    box.innerHTML = `
      <div class="card">
        <div class="meta-row" style="justify-content:space-between;align-items:center">
          <div>
            <h3 style="margin:0">${esc(u.fullName)}</h3>
            <p style="margin:4px 0 0;color:var(--ink-light);font-size:.85rem">${esc(u.phone)} · ${u.country === "YE" ? "اليمن" : u.country === "SA" ? "السعودية" : esc(u.country)}${u.city ? " · " + esc(u.city) : ""}</p>
          </div>
          <span class="badge ${u.isPremium ? "status-open" : ""}">${u.isPremium ? "عضو مميز ⭐" : "عضو عادي"}</span>
        </div>
      </div>

      ${!u.isPremium ? `
      <div class="card alert-warn" style="background:var(--amber-50)">
        <strong>ترقية إلى العضوية المميزة</strong>
        <p style="font-size:.82rem;margin:6px 0 10px">إعلانات مميزة بالأعلى، شارة موثوق، وأولوية ظهور — ادفع عبر محفظتك الرقمية.</p>
        <a href="/pages/premium.html" class="btn btn-amber">عرض خطط الاشتراك</a>
      </div>` : ""}

      <div class="card">
        <h3 style="margin:0 0 10px">إعلاناتي وطلباتي</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <a href="/pages/real-estate.html?mine=1" class="btn btn-outline btn-sm">عقاراتي</a>
          <a href="/pages/vehicles.html?mine=1" class="btn btn-outline btn-sm">رحلاتي</a>
          <a href="/pages/shipping.html?mine=1" class="btn btn-outline btn-sm">شحناتي</a>
          <a href="/pages/transfer.html?mine=1" class="btn btn-outline btn-sm">تحويلاتي</a>
        </div>
      </div>

      <a href="/pages/inbox.html" class="btn btn-outline" style="margin-bottom:12px">💬 رسائلي</a>
      ${u.isAdmin ? `<a href="/pages/admin.html" class="btn btn-amber" style="margin-bottom:12px">⚙️ لوحة التحكم</a>` : ""}

      <button class="btn btn-outline" id="logout-btn">تسجيل الخروج</button>
    `;
    document.getElementById("logout-btn").onclick = () => {
      DB.logout().then(() => (window.location.href = "/index.html"));
    };
  });

  renderFooter();
</script>
</body>
</html>
